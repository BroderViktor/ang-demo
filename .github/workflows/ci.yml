name: Run Spec Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      - name: Set up Node
        uses: useblacksmith/setup-node@v5
        with:
          node-version: 18
      - name: install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: npm install
      - name: Setup Prisma
        run: cd server && npx prisma generate && cd ..
      - name: Run ESLint
        run: npm run lint
      - name: Run TS Check
        run: npm run typesafety
      - name: Run Build
        run: npm run build
