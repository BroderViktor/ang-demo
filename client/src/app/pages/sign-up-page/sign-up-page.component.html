<mat-form-field>
  <input
    matInput
    type="email"
    placeholder="Email"
    [formControl]="emailControl"
  />
</mat-form-field>
<mat-form-field>
  <input
    matInput
    type="password"
    placeholder="Password"
    [formControl]="passwordControl"
  />
</mat-form-field>
<br />
<p class="text-red-500">{{ errorMsg() }}</p>
<br />

<button class="bg-amber-500 hover:bg-amber-600" (click)="signUp()">
  Sign Up
</button>
